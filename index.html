<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Universitaire</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }

        body {
            min-height: 100dvh; display: flex; justify-content: center; align-items: center;
            padding: clamp(8px, 2vw, 20px);
            background: url('univ.jpeg') center/cover no-repeat fixed; position: relative;
        }

        .overlay { position: fixed; inset: 0; background: rgba(0,10,30,0.25); z-index: 0; }

        .card {
            width: 100%; max-width: min(92vw, 340px);
            padding: clamp(14px, 3vw, 22px);
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            border-radius: clamp(12px, 2.5vw, 16px);
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            z-index: 1; position: relative;
            animation: fadeUp .4s ease-out;
        }

        h1 {
            color: #fff; text-align: center;
            font-size: clamp(1rem, 4vw, 1.25rem);
            font-weight: 700; letter-spacing: .2px;
            text-shadow: 0 1px 8px rgba(0,0,0,0.4);
            margin-bottom: clamp(12px, 2.5vw, 18px);
        }

        .tabs {
            display: flex; gap: 4px; margin-bottom: clamp(10px, 2vw, 16px);
            background: rgba(0,0,0,0.15); border-radius: 10px; padding: 3px;
        }

        .tab {
            flex: 1; padding: clamp(5px, 1.2vw, 8px) 3px;
            text-align: center;
            font-size: clamp(.58rem, 1.8vw, .68rem);
            font-weight: 600; color: rgba(255,255,255,0.55);
            background: transparent; border: none; border-radius: 8px;
            cursor: pointer; transition: all .2s ease;
            letter-spacing: .2px; text-transform: uppercase;
            line-height: 1.1;
        }

        .tab:hover { color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.06); }
        .tab.active { color: #fff; background: rgba(255,255,255,0.12); box-shadow: 0 1px 6px rgba(0,0,0,0.1); }
        .tab i { display: block; margin-bottom: 2px; font-size: clamp(.7rem, 2vw, .8rem); }

        .panel { display: none; }
        .panel.active { display: block; }

        .buttons { display: flex; flex-direction: column; gap: clamp(6px, 1.2vw, 9px); }

        .btn {
            display: flex; align-items: center; gap: clamp(6px, 1.2vw, 10px);
            padding: clamp(7px, 1.4vw, 10px) clamp(10px, 2vw, 14px);
            font-size: clamp(.7rem, 2vw, .78rem);
            font-weight: 600; letter-spacing: .3px;
            color: #fff; background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: clamp(8px, 1.5vw, 10px);
            cursor: pointer; text-decoration: none;
            transition: all .2s ease; position: relative; overflow: hidden;
            height: clamp(34px, 7vw, 40px);
        }

        .btn::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0;
            width: 3px; border-radius: 3px 0 0 3px;
        }

        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,0.18); }
        .btn:active { transform: translateY(0); }

        .btn .icon { width: 18px; text-align: center; font-size: clamp(.75rem, 2vw, .85rem); flex-shrink: 0; }
        .btn .label { flex: 1; }
        .btn .arrow { opacity: 0; transition: all .2s ease; font-size: .85rem; }
        .btn:hover .arrow { opacity: .6; transform: translateX(2px); }

        .new-dot {
            position: absolute; top: 4px; right: 4px;
            width: 7px; height: 7px; border-radius: 50%;
            background: #ff4757; animation: pulse 1.8s ease-in-out infinite;
        }

        .btn-rose::before   { background: #ff6b8a; }
        .btn-bleu::before   { background: #5b8def; }
        .btn-orange::before { background: #ff9f43; }
        .btn-vert::before   { background: #2ed573; }
        .btn-violet::before { background: #a55eea; }
        .btn-cyan::before   { background: #45d6e6; }
        .btn-jaune::before  { background: #feca57; }
        .btn-rouge::before  { background: #ff4757; }

        .btn-rose:hover   { background: rgba(255,107,138,0.14); }
        .btn-bleu:hover   { background: rgba(91,141,239,0.14); }
        .btn-orange:hover { background: rgba(255,159,67,0.14); }
        .btn-vert:hover   { background: rgba(46,213,115,0.14); }
        .btn-violet:hover { background: rgba(165,94,234,0.14); }
        .btn-cyan:hover   { background: rgba(69,214,230,0.14); }
        .btn-jaune:hover  { background: rgba(254,202,87,0.14); }
        .btn-rouge:hover  { background: rgba(255,71,87,0.14); }

        footer {
            margin-top: clamp(10px, 2vw, 16px); text-align: center;
            color: rgba(255,255,255,0.45);
            font-size: clamp(.6rem, 1.8vw, .66rem);
            letter-spacing: .2px;
        }

        @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        @keyframes pulse { 0%,100% { transform:scale(1); opacity:.85; } 50% { transform:scale(1.2); opacity:1; } }

        @media (max-height: 500px) and (orientation: landscape) {
            body { align-items: flex-start; padding: 6px; }
            .card { max-width: 98%; padding: 10px 12px; margin-top: 6px; }
            .tabs { margin-bottom: 8px; }
            .buttons { flex-direction: row; flex-wrap: wrap; gap: 5px; }
            .btn { flex: 1; min-width: 100px; height: 32px; justify-content: center; font-size: .65rem; }
            .btn .icon { display: none; }
            .btn .arrow { display: none; }
            h1 { font-size: .9rem; margin-bottom: 8px; }
            footer { margin-top: 8px; }
        }

        @media (prefers-reduced-motion: reduce) { .card, .btn, .new-dot { animation:none; transition:none; } }
        @media (prefers-color-scheme: dark) { .card { background: rgba(0,0,0,0.2); } }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="card" role="main">
        <h1><i class="fas fa-university" style="margin-right: 8px;"></i>Portail Universitaire</h1>

        <div class="tabs" role="tablist">
            <button class="tab active" data-tab="etudiant" role="tab" aria-selected="true">
                <i class="fas fa-graduation-cap"></i> Étudiant
            </button>
            <button class="tab" data-tab="enseignants" role="tab" aria-selected="false">
                <i class="fas fa-chalkboard-teacher"></i> Enseignants
            </button>
            <button class="tab" data-tab="doyen" role="tab" aria-selected="false">
                <i class="fas fa-user-tie"></i> Admin & Doyen
            </button>
        </div>

        <!-- Panel Étudiant -->
        <div class="panel active" id="panel-etudiant" role="tabpanel">
            <div class="buttons">
                <a href="Inscription.html" class="btn btn-rose">
                    <span class="icon"><i class="fas fa-user-plus"></i></span>
                    <span class="label">INSCRIPTION</span>
                    <span class="arrow"><i class="fas fa-chevron-right"></i></span>
                    <span class="new-dot"></span>
                </a>
                <a href="Programme.html" class="btn btn-bleu">
                    <span class="icon"><i class="fas fa-calendar-alt"></i></span>
                    <span class="label">PROGRAMME</span>
                    <span class="arrow"><i class="fas fa-chevron-right"></i></span>
                </a>
                <a href="Notes.html" class="btn btn-orange">
                    <span class="icon"><i class="fas fa-file-alt"></i></span>
                    <span class="label">NOTES</span>
                    <span class="arrow"><i class="fas fa-chevron-right"></i></span>
                </a>
            </div>
        </div>

        <!-- Panel Enseignants -->
        <div class="panel" id="panel-enseignants" role="tabpanel">
            <div class="buttons">
                <a href="AppliCours_Universite.html" class="btn btn-jaune">
                    <span class="icon"><i class="fas fa-chalkboard-teacher"></i></span>
                    <span class="label">ENS-P-C</span>
                    <span class="arrow"><i class="fas fa-chevron-right"></i></span>
                </a>
                <a href="mes.html" class="btn btn-rouge">
                    <span class="icon"><i class="fas fa-chalkboard"></i></span>
                    <span class="label">ENS-P-F</span>
                    <span class="arrow"><i class="fas fa-chevron-right"></i></span>
                </a>
            </div>
        </div>

        <!-- Panel Administration & Doyen -->
        <div class="panel" id="panel-doyen" role="tabpanel">
            <div class="buttons">
                <a href="Programme.html" class="btn btn-bleu">
                    <span class="icon"><i class="fas fa-calendar-alt"></i></span>
                    <span class="label">PROGRAMME</span>
                    <span class="arrow"><i class="fas fa-chevron-right"></i></span>
                </a>
                <a href="Admin.html" class="btn btn-vert">
                    <span class="icon"><i class="fas fa-user-cog"></i></span>
                    <span class="label">SECRETARY</span>
                    <span class="arrow"><i class="fas fa-chevron-right"></i></span>
                </a>
                <a href="Base.html" class="btn btn-violet">
                    <span class="icon"><i class="fas fa-user-shield"></i></span>
                    <span class="label">ADMINISTRATION</span>
                    <span class="arrow"><i class="fas fa-chevron-right"></i></span>
                </a>
                <a href="Diplôme.html" class="btn btn-cyan">
                    <span class="icon"><i class="fas fa-certificate"></i></span>
                    <span class="label">DIPLÔME-UNIVERSITAIRE</span>
                    <span class="arrow"><i class="fas fa-chevron-right"></i></span>
                </a>
            </div>
        </div>

        <footer>
            <p>Cliquez sur un service pour y accéder</p>
        </footer>
    </div>

    <script>
        // Fallback background si image absente
        window.addEventListener('load', () => {
            const img = new Image();
            img.src = 'univ.jpeg';
            img.onerror = () => {
                document.body.style.background = 'linear-gradient(135deg, #0c1e3a 0%, #1a4f8a 50%, #218c5c 100%)';
                document.querySelector('.overlay').style.display = 'none';
            };
        });

        // Tabs switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => {
                    t.classList.remove('active');
                    t.setAttribute('aria-selected', 'false');
                });
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

                tab.classList.add('active');
                tab.setAttribute('aria-selected', 'true');

                const panel = document.getElementById('panel-' + tab.dataset.tab);
                if (panel) panel.classList.add('active');
            });
        });

        // Clic effect
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function (e) {
                this.style.transform = 'scale(0.97)';
                setTimeout(() => this.style.transform = '', 150);
            });
        });


    </script>
</body>
</html>
